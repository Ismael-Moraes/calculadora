<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1 class="tirulo">Calculadora</h1>
    <div class="calc" id="calc">

        <!-- Visor Calculadora -->
        <div class="visor" id="visor">
            <p class="visorzinho" id="visorzinho">000</p>
        </div>

        <!-- Resultados -->
        <div class="resul" id="resul">
            <button class="bResu" id="bResu">=</button>
            <button class="apagAll" id="apagAll">C</button>
            <button class="apagaUm" id="apagaUm"><</button>
            <button class="potente" id="potente">x²</button>
            <button class="nutella" id="nutella">Sqrt</button>
        </div>

        <div class="areaBotoes" id="areaBotoes">
            <!-- Numeros -->
            <div class="numeros" id="numeros">
                <button class="b1" id="b1">1</button>
                <button class="b2" id="b2">2</button>
                <button class="b3" id="b3">3</button>
                <button class="b4" id="b4">4</button>
                <button class="b5" id="b5">5</button>
                <button class="b6" id="b6">6</button>
                <button class="b7" id="b7">7</button>
                <button class="b8" id="b8">8</button>
                <button class="b9" id="b9">9</button>
                <button class="b0" id="b0">0</button>
                <button class="bv" id="bv">,</button>
            </div>

            <!-- Operações -->
            <div class="operacoes" id="operacoes">
                <button class="soma" id="soma">+</button>
                <button class="subt" id="subt">-</button>
                <button class="mult" id="mult">x</button>
                <button class="divs" id="divs">/</button>
                <button class="porc" id="porc">%</button>
            </div>
        </div>
    </div>

    <button class="strogonoff" id="strogonoff">On/Off</button>
</body>
</html>
